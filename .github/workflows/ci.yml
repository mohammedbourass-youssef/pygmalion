name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      VITE_DONATE_URL: ${{ vars.VITE_DONATE_URL || 'https://github.com/sponsors/mohammedbourass-youssef' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run backend tests in Linux container
        run: docker build --file Infrastructure/docker/test.Dockerfile --tag pygmalion-tests . && docker run --rm pygmalion-tests

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f Infrastructure/docker-compose.yml config --quiet

      - name: Validate production Nginx configuration
        run: |
          mkdir -p /tmp/pygmalion-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=pygmalion.mohammedbourass.me" \
            -keyout /tmp/pygmalion-certs/pygmalion.key \
            -out /tmp/pygmalion-certs/pygmalion.pem
          docker run --rm \
            -v "$GITHUB_WORKSPACE/Infrastructure/nginx/pygmalion.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "/tmp/pygmalion-certs:/etc/ssl/cloudflare:ro" \
            nginx:1.27-alpine nginx -t

      - name: Build production containers
        run: docker compose --env-file .env.example -f Infrastructure/docker-compose.yml build

  deploy-production:
    name: Deploy production
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != '' && vars.DEPLOY_USER != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/pygmalion' }}
      VITE_DONATE_URL: ${{ vars.VITE_DONATE_URL || 'https://github.com/sponsors/mohammedbourass-youssef' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure verified host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync application source
        run: |
          mkdir -p Interface/public
          printf 'DEPLOY_HOST=%s\nDEPLOY_PATH=%s\n' "$DEPLOY_HOST" "$DEPLOY_PATH" > Interface/public/deploy-diagnostics.txt
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env'"
          rsync -az --filter='P /.env' \
            --exclude='.git/' --exclude='**/node_modules/' --exclude='**/bin/' \
            --exclude='**/obj/' --exclude='**/dist/' --exclude='**/publish/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$DEPLOY_PATH/Backend-Api/Data/PygmalionDbContext.cs' '$DEPLOY_PATH/Backend-Api/Models/DataGenerated.cs' '$DEPLOY_PATH/Backend-Api/Services/GeneratedDataService.cs' '$DEPLOY_PATH/Backend-Api/Services/IGeneratedDataService.cs' '$DEPLOY_PATH/Backend-Api/Backend-Api.Tests/GeneratedDataServiceTests.cs' '$DEPLOY_PATH/docker-compose.override.yml' '$DEPLOY_PATH/docker-compose.override.yaml' '$DEPLOY_PATH/Infrastructure/docker-compose.override.yml' '$DEPLOY_PATH/Infrastructure/docker-compose.override.yaml'; rmdir '$DEPLOY_PATH/Backend-Api/Data' '$DEPLOY_PATH/Backend-Api/Models' 2>/dev/null || true"

      - name: Deploy containers, including Nginx
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"
          if ! docker compose --env-file .env -f Infrastructure/docker-compose.yml up -d --build; then
            docker compose --env-file .env -f Infrastructure/docker-compose.yml ps || true
            docker compose --env-file .env -f Infrastructure/docker-compose.yml logs --no-color --tail=100 backend-api interface nginx || true
            exit 1
          fi
          if ! docker compose --env-file .env -f Infrastructure/docker-compose.yml exec -T nginx nginx -t; then
            docker compose --env-file .env -f Infrastructure/docker-compose.yml ps || true
            docker compose --env-file .env -f Infrastructure/docker-compose.yml logs --no-color --tail=100 backend-api interface nginx || true
            exit 1
          fi
          if ! docker compose --env-file .env -f Infrastructure/docker-compose.yml up -d --force-recreate --no-deps nginx; then
            docker compose --env-file .env -f Infrastructure/docker-compose.yml ps || true
            docker compose --env-file .env -f Infrastructure/docker-compose.yml logs --no-color --tail=100 nginx || true
            exit 1
          fi
          REMOTE
