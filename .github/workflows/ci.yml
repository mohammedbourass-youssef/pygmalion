name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      VITE_DONATE_URL: ${{ vars.VITE_DONATE_URL || 'https://github.com/sponsors/mohammedbourass-youssef' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run backend tests in Linux container
        run: docker build --file Infrastructure/docker/test.Dockerfile --tag pygmalion-tests . && docker run --rm pygmalion-tests

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f Infrastructure/docker-compose.yml config --quiet

      - name: Validate production Nginx configuration
        run: |
          mkdir -p /tmp/pygmalion-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=pygmalion.mohammedbourass.me" \
            -keyout /tmp/pygmalion-certs/pygmalion.key \
            -out /tmp/pygmalion-certs/pygmalion.pem
          docker run --rm \
            -v "$GITHUB_WORKSPACE/Infrastructure/nginx/pygmalion.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "/tmp/pygmalion-certs:/etc/ssl/cloudflare:ro" \
            nginx:1.27-alpine nginx -t

      - name: Build production containers
        run: docker compose --env-file .env.example -f Infrastructure/docker-compose.yml build

  deploy-production:
    name: Deploy production
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != '' && vars.DEPLOY_USER != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/pygmalion' }}
      VITE_DONATE_URL: ${{ vars.VITE_DONATE_URL || 'https://github.com/sponsors/mohammedbourass-youssef' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static UI for host Nginx
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/Interface \
            -e VITE_API_BASE_URL="" \
            -e VITE_DONATE_URL="$VITE_DONATE_URL" \
            node:22-alpine sh -c "npm ci && npm run build"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure verified host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync application source
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env'"
          rsync -az --delete --filter='P /.env' \
            --exclude='.git/' --exclude='**/node_modules/' --exclude='**/bin/' \
            --exclude='**/obj/' --exclude='**/dist/' --exclude='**/publish/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Sync built UI assets
        run: rsync -az --delete Interface/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.deploy-dist/"

      - name: Deploy containers and reload Nginx
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && \
            docker compose --env-file .env -f Infrastructure/docker-compose.yml up -d --build && \
            sudo mkdir -p /var/www/pygmalion/dist && \
            sudo rsync -a --delete .deploy-dist/ /var/www/pygmalion/dist/ && \
            sudo mkdir -p /etc/nginx/conf.d && \
            sudo install -m 0644 Infrastructure/nginx/pygmalion.conf /etc/nginx/conf.d/pygmalion.conf && \
            sudo nginx -t && sudo systemctl reload nginx"
