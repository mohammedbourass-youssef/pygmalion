services:
  postgres:
    image: postgres:17-alpine
    container_name: pygmalion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - pygmalion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend-api:
    build:
      context: ..
      dockerfile: Infrastructure/docker/backend.Dockerfile
    container_name: pygmalion-backend-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Pygmalion: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in the root .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in the root .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      DomaineName: ${API_PUBLIC_HOST:?Set API_PUBLIC_HOST in the root .env}
      UseSsl: ${API_USE_SSL:?Set API_USE_SSL in the root .env}
      GeneratedData__OutputDirectory: ${GeneratedData__OutputDirectory:-output}
      OpenTelemetry__Endpoint: ${OpenTelemetry__Endpoint:-http://otel-collector:4317}
      Seq__ServerUrl: ${Seq__ServerUrl:-http://seq:80}
    ports:
      - "127.0.0.1:${API_PORT:-5050}:8080"
    volumes:
      - pygmalion-output:/app/output
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  interface:
    build:
      context: ..
      dockerfile: Infrastructure/docker/interface.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DONATE_URL: ${VITE_DONATE_URL:-https://github.com/sponsors/mohammedbourass-youssef}
    container_name: pygmalion-interface
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTERFACE_PORT:-3000}:80"
    depends_on:
      - backend-api

  nginx:
    image: nginx:1.27-alpine
    container_name: pygmalion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pygmalion.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH in the root .env}:/etc/ssl/cloudflare/pygmalion.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH in the root .env}:/etc/ssl/cloudflare/pygmalion.key:ro
    depends_on:
      interface:
        condition: service_started
      backend-api:
        condition: service_healthy
      grafana:
        condition: service_started

  seq:
    image: datalust/seq:2025.2
    container_name: pygmalion-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?Set SEQ_ADMIN_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - pygmalion-seq:/data

  tempo:
    image: grafana/tempo:2.8.1
    container_name: pygmalion-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - pygmalion-tempo:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: pygmalion-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pygmalion-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pygmalion-prometheus:/prometheus
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:12.1.0
    container_name: pygmalion-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the root .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://pygmalion.mohammedbourass.me/Grafana/}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "Lax"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - pygmalion-grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  pygmalion-postgres:
  pygmalion-output:
  pygmalion-seq:
  pygmalion-tempo:
  pygmalion-prometheus:
  pygmalion-grafana:
