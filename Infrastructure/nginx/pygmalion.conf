server {
    listen 80;
    server_name pygmalion.mohammedbourass.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pygmalion.mohammedbourass.me;
    add_header X-Pygmalion-Nginx "grafana-route-20261124" always;

    ssl_certificate /etc/ssl/cloudflare/pygmalion.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pygmalion.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:pygmalion_tls:10m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /var/www/pygmalion/dist;
    index index.html;

    location /api/ {
        set $api_upstream backend-api:8080;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /grafana {
        return 301 /Grafana/$is_args$args;
    }

    location /grafana/ {
        rewrite ^/grafana/(.*)$ /Grafana/$1 permanent;
    }

    location = /Grafana {
        return 301 /Grafana/$is_args$args;
    }

    location /Grafana/ {
        set $grafana_upstream grafana:3000;
        rewrite ^/Grafana/(.*)$ /$1 break;
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        set $ui_upstream interface:80;
        proxy_pass http://$ui_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
